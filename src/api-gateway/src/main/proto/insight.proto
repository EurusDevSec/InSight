// InSight API Gateway — gRPC/REST Contract Definition
//
// This proto defines the service contracts between Flutter ↔ API Gateway.
// The Gateway implements these as REST endpoints (Task 4.2) and forwards
// requests to the Vision and RAG FastAPI services via HTTP.
//
// REST mapping:
//   InsightService.AnalyzeMeal → POST /api/gateway/analyze (multipart)

syntax = "proto3";

package insight;

option java_package = "com.insight.grpc";
option java_multiple_files = true;

// ── Main Pipeline Service ─────────────────────────────────────────

service InsightService {
  // Full pipeline: Image → Volume → GL → RAG Advice
  rpc AnalyzeMeal(MealAnalysisRequest) returns (MealAnalysisResponse);
}

message MealAnalysisRequest {
  bytes          image_data      = 1; // JPEG/PNG bytes
  string         food_id         = 2; // e.g. "vn_com_trang", "vn_pho_bo"
  PatientContext patient_context = 3; // optional patient info
}

message PatientContext {
  double current_glucose_mg_dl  = 1; // current blood glucose
  string diabetes_type          = 2; // type_1, type_2, gestational
  double insulin_to_carb_ratio  = 3; // 1 Unit per X grams
  double correction_factor      = 4; // mg/dL per 1 Unit
  double target_glucose_mg_dl   = 5; // target glucose level
}

message MealAnalysisResponse {
  // Vision results
  string food_name       = 1;
  double volume_ml       = 2;
  double weight_g        = 3;
  double carbs_g         = 4;
  double glycemic_load   = 5;
  string gl_level        = 6; // low / medium / high
  double confidence      = 7;

  // RAG results
  string          advice             = 8;
  string          insulin_suggestion = 9;
  repeated string warnings           = 10;

  // Pipeline info
  double pipeline_time_ms = 11;
  string disclaimer       = 12;
}