# src/api-gateway/src/main/resources/application.yml

spring:
  application:
    name: insight-api-gateway
  datasource:
    url: jdbc:postgresql://localhost:5432/insight_db
    username: insight
    password: insight123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  cache:
    type: redis
    redis:
      time-to-live: 3600000 # 1 hour
  data:
    redis:
      host: localhost
      port: 6379
      password: insight_redis_2026
  kafka:
    bootstrap-servers: localhost:9092

server:
  port: 8080
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# InSight service URLs
insight:
  services:
    vision-url: ${VISION_SERVICE_URL:http://localhost:8000}
    rag-url: ${RAG_SERVICE_URL:http://localhost:8001}
  kafka:
    topic:
      meal-analysis: meal-analysis-events

management:
  endpoints:
    web:
      exposure:
        include: health,info
