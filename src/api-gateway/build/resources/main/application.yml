# src/api-gateway/src/main/resources/application.yml

spring:
  application:
    name: insight-api-gateway
  datasource:
    url: jdbc:postgresql://localhost:5432/insight_db
    username: insight
    password: insight123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  data:
    redis:
      host: localhost
      port: 6379
      # no password set in docker-compose
  kafka:
    bootstrap-servers: localhost:9092

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
