name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ===== BACKEND JAVA =====
  backend-java:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check if Java project exists
        id: check-java
        run: |
          if [ -f "src/api-gateway/build.gradle" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ Java backend not initialized yet. Skipping build."
          fi

      - name: Set up JDK 17
        if: steps.check-java.outputs.exists == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        if: steps.check-java.outputs.exists == 'true'
        uses: gradle/actions/setup-gradle@v3

      - name: Build with Gradle
        if: steps.check-java.outputs.exists == 'true'
        run: |
          cd src/api-gateway
          ./gradlew clean build -x test

      - name: Run Java tests
        if: steps.check-java.outputs.exists == 'true'
        run: |
          cd src/api-gateway
          ./gradlew test

  # ===== BACKEND PYTHON =====
  backend-python:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies and test
        run: |
          if [ -f "src/vision-service/requirements.txt" ]; then
            cd src/vision-service
            pip install -r requirements.txt
            pip install pytest pytest-cov
            if [ -d "tests" ]; then
              pytest tests/ -v --cov=services --cov-report=xml
            else
              echo "No tests found in vision-service yet. Skipping."
            fi
          else
            echo "Python vision-service not initialized or missing requirements.txt. Skipping."
          fi

  # ===== MOBILE FLUTTER =====
  mobile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Check Flutter
        run: |
          if [ -d "mobile/insight_app" ] && [ -f "mobile/insight_app/pubspec.yaml" ]; then
            cd mobile/insight_app
            flutter pub get
            flutter analyze
          else
            echo "Mobile app (insight_app) not initialized or missing pubspec.yaml. Skipping."
          fi

  # ===== DOCKER COMPOSE =====
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose
        run: docker compose -f infra/docker/docker-compose.yml config
